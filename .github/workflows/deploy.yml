name: CD - Containerization & Deployment

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  containerize:
    name: Containerization Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config

      - name: Build Frontend Container Image
        run: |
          docker build -t steam-frontend:check -f frontend/Dockerfile frontend/

  deploy:
    name: Deploy to Production Server
    needs: containerize
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy on VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          script_stop: true
          script: |
            cd /root/Steam-reviews-analysis
            git pull origin main
            docker cp ./backend/. $(docker compose ps -q backend):/app/backend/
            docker compose restart backend
            docker compose up -d --build frontend
            docker compose ps

