name: CD - Containerization & Deployment

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  containerize:
    name: Containerization Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config

      - name: Build Frontend Container Image
        run: |
          docker build -t steam-frontend:check -f frontend/Dockerfile frontend/

  deploy:
    name: Deploy to Production Server
    needs: containerize
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy on VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          timeout: 30m
          command_timeout: 30m
          script_stop: true
          script: |
            git config --global --add safe.directory /root/Steam-reviews-analysis
            cd /root/Steam-reviews-analysis
            git fetch origin main
            git reset --hard origin/main
            if [ -n "$(docker compose ps -q backend)" ]; then
              docker cp ./backend/. $(docker compose ps -q backend):/app/backend/
              docker compose restart backend
            else
              docker compose up -d backend
            fi
            docker compose build frontend
            docker compose up -d --no-deps frontend
            docker compose ps
